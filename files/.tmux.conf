# Set the default terminal to support 256 colors and true color
set -g default-terminal "tmux-256color"

# Enable true color (RGB) support for various terminal types
# terminal-overrides tells tmux what the OUTER terminal supports
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*-256color:RGB"

# Add Tc (True Color) flag for applications that check for it
set -ag terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ",*-256color:Tc"


# Mouse support
set -g mouse on

set -g focus-events on

# OSC 8 hyperlink passthrough. The xterm-ghostty terminfo has no Hls capability
# and tmux has no built-in ghostty profile, so tmux strips hyperlinks unless
# told the outer terminal understands them.
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Tmux clipboard - set-clipboard handles copy mode,
# allow-passthrough lets applications send OSC 52 to the outer terminal
set -s set-clipboard on
set -g allow-passthrough on

# Extended keys (e.g. Shift+Enter, Ctrl+Enter) passthrough
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Ctrl+K clears screen and tmux scrollback (preserves iTerm2 scrollback)
bind-key -n C-k send-keys -R C-l \; clear-history

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

# prefix + u -> fzf picker over every URL on screen. Enter opens, ctrl-y copies,
# Tab marks multiple. Pulls in `xre` on first use; pin '#legacy' for the
# grep-based version if that's unwanted.
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-w 60% -h 40% --multi -0 --no-preview'

# Dracula theme options
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-show-left-icon session

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
